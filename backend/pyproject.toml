[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfactory-v2-backend"
version = "0.1.0"
description = "FastAPI backend for SmartFactoryV2 hackathon MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pandas>=2.0",
  "xgboost>=2.0",
  "ortools>=9.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
